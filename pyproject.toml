[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-predicate-kg"
version = "1.0.0"
description = "Driving-scene Predicate Knowledge Graph framework with a nuPlan reference extractor"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.23",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "rdflib>=7.0",
  "shapely>=2.0",
  "networkx>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
nuplan = ["nuplan-devkit @ git+https://github.com/motional/nuplan-devkit.git"]

[project.scripts]
nuplan-predicate-kg = "nuplan_predicate_kg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nuplan_predicate_kg*", "nuplan_predicates_modular*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
